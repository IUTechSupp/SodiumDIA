name: Update Issue Content in README

on:
  push:
    paths:
      - 'README.md'
    branches:
      - main
  workflow_dispatch:  # ручной запуск

permissions:
  issues: read
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Предотвращаем цикл: не запускаем от коммитов самого бота
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt update && sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Set gh flags
        run: |
          export NO_COLOR=1
          export GH_FORCE_TTY=1
      
      - name: Update issues in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: update
        run: |
          python << 'EOF'
          import re
          import subprocess
          import sys
          import json
          
          readme_path = 'README.md'
          repo = '${{ github.repository }}'
          
          with open(readme_path, 'r') as f:
              content = f.read()

          # Ищем все маркеры: <!-- ISSUE:123 start --> ... <!-- ISSUE:123 end -->
          pattern = r'(<!-- ISSUE:(\d+) start -->)(.*?)(<!-- ISSUE:\2 end -->)'

          def replacer(match):
              start_marker = match.group(1)
              issue_num = match.group(2)
              end_marker = match.group(4)

              # Получаем вывод задачи через gh
              try:
                  result = subprocess.run(
                      ['gh', 'issue', 'view', issue_num, '--repo', repo, '--json', 'title,body,author,state,number,projectItems,url'],
                      capture_output=True, text=True, check=True, timeout=30
                  )

                  data = json.loads(result.stdout)
                  # Извлекаем статус из первого попавшегося projectItem (если есть)
                  status = "unknown"
                  if data.get('projectItems'):
                      # Берём первый элемент, у него есть status.name
                      status = data['projectItems'][0].get('status', {}).get('name', 'no status')

                  # Формируем бейдж

                  status_color = "green" if status=="Todo" else "orange" if status=="In progress" else "blue" if status=="Done" else "grey"
                  badge_url = f"https://img.shields.io/badge/-{status}-{status_color}"
                  issue_url = f"https://github.com/{repo}/issues/{issue_num}"
                  badge_md = f"[![Static Badge]({badge_url})]({issue_url})"

                  # Формируем итоговый Markdown
                  output = f"""### [#{data['number']}: {data['title']}]({data['url']}) {badge_md}
                  
                  **Автор:** @{data['author']['login']}
                  
                  {data['body']}
                  """
              except subprocess.CalledProcessError as e:
                  output = f"⚠️ Ошибка при загрузке задачи #{issue_num}:\n{e.stderr.strip()}"
              except Exception as e:
                  output = f"⚠️ Непредвиденная ошибка: {e}"

              # Возвращаем маркеры с новым содержимым между ними
              return f"{start_marker}\n\n{output}\n\n{end_marker}"

          
          new_content = re.sub(pattern, replacer, content, flags=re.DOTALL)

          if new_content != content:
              with open(readme_path, 'w') as f:
                  f.write(new_content)
              print("README.md изменён, будет создан коммит")
              sys.exit(0)
          else:
              print("Изменений не требуется")
              sys.exit(1)
          EOF

      - name: Commit and push if changed
        if: success() && steps.update.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: обновление содержимого задачи в README [skip ci]"
          git push
